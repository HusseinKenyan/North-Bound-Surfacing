<!--
  ============================================================
  00 · GLOBAL HEAD (fonts + all styles)
  GHL: Funnel/Website > Page > Settings > Tracking Code > HEADER
  (or paste into the first Custom Code element on the page)
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --nbs-orange: #F89E1B;
    --nbs-orange-hover: #FFB23F;
    --nbs-orange-deep: #D9820A;
    --nbs-black: #0F0F0F;
    --nbs-ink: #231F20;
    --nbs-charcoal: #181818;
    --nbs-tile: #242424;
    --nbs-tile-hover: #2E2E2E;
    --nbs-line-dark: rgba(255, 255, 255, .12);
    --nbs-light: #F5F4F1;
    --nbs-white: #FFFFFF;
    --nbs-muted: #6A6A6A;
    --nbs-muted-dark: #B5B5B5;
    --nbs-green: #1FA35C;
    --nbs-radius: 14px;
    --nbs-head: 'Montserrat', system-ui, sans-serif;
    --nbs-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  .nbs, .nbs * { box-sizing: border-box; }
  .nbs { font-family: var(--nbs-body); color: var(--nbs-ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .nbs img { max-width: 100%; display: block; }
  .nbs h1, .nbs h2, .nbs h3 { font-family: var(--nbs-head); margin: 0; line-height: 1.15; letter-spacing: -.01em; }
  .nbs p { margin: 0; }
  .nbs-wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  .nbs-narrow { max-width: 720px; }
  .nbs-section { padding: 56px 0; }
  .nbs-dark { background: var(--nbs-charcoal); color: var(--nbs-white); }
  .nbs-light { background: var(--nbs-light); }
  .nbs-white-bg { background: var(--nbs-white); }
  .nbs-title { font-size: clamp(26px, 5.6vw, 38px); font-weight: 800; text-align: center; }
  .nbs-title .nbs-hl { color: var(--nbs-orange); }
  .nbs-sub { text-align: center; color: var(--nbs-muted); margin-top: 10px; font-size: 16px; }
  .nbs-dark .nbs-sub { color: var(--nbs-muted-dark); }
  .nbs-hl { color: var(--nbs-orange); }

  /* ---------- Buttons ---------- */
  .nbs-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    font-family: var(--nbs-head); font-weight: 800; font-size: 17px; letter-spacing: .01em;
    background: var(--nbs-orange); color: var(--nbs-black) !important; text-decoration: none !important;
    border: 0; border-radius: 10px; padding: 17px 28px; cursor: pointer;
    box-shadow: 0 6px 0 var(--nbs-orange-deep), 0 10px 24px rgba(248, 158, 27, .28);
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .nbs-btn:hover { background: var(--nbs-orange-hover); }
  .nbs-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--nbs-orange-deep), 0 4px 12px rgba(248, 158, 27, .25); }
  .nbs-btn[disabled] { opacity: .45; cursor: not-allowed; }
  .nbs-btn-block { width: 100%; }
  .nbs-cta-row { text-align: center; margin-top: 32px; }
  .nbs-cta-note { font-size: 13px; color: var(--nbs-muted); margin-top: 20px; }
  .nbs-dark .nbs-cta-note { color: var(--nbs-muted-dark); }

  /* ---------- Stars / badges ---------- */
  .nbs-stars { color: #FBBC05; letter-spacing: 2px; font-size: 15px; line-height: 1; }
  .nbs-google { font-family: 'Arial', sans-serif; font-weight: 700; letter-spacing: -.02em; }
  .nbs-google b:nth-child(1), .nbs-google b:nth-child(4) { color: #4285F4; }
  .nbs-google b:nth-child(2), .nbs-google b:nth-child(6) { color: #EA4335; }
  .nbs-google b:nth-child(3) { color: #FBBC05; }
  .nbs-google b:nth-child(5) { color: #34A853; }

  /* ---------- 01 Header + offer bar ---------- */
  .nbs-header { background: var(--nbs-black); border-bottom: 1px solid var(--nbs-line-dark); }
  .nbs-header .nbs-wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 68px; }
  .nbs-header-logo { height: 38px; width: auto; }
  .nbs-header-rating { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; color: #fff; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .nbs-header-rating .nbs-google { font-size: 17px; }
  .nbs-header-rating .nbs-stars { font-size: 12px; }
  .nbs-offer-bar { background: var(--nbs-orange); color: var(--nbs-black); text-align: center; font-family: var(--nbs-head); font-weight: 800; font-size: 15px; padding: 10px 16px; }
  .nbs-offer-bar span { text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- 02 Hero ---------- */
  .nbs-hero { background: radial-gradient(120% 70% at 50% 0%, #262626 0%, var(--nbs-charcoal) 60%); color: #fff; padding: 26px 0 0; text-align: center; }
  .nbs-hero-kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--nbs-muted-dark); margin-bottom: 12px; }
  .nbs-hero-kicker .nbs-stars { font-size: 13px; }
  .nbs-hero h1 { font-size: clamp(30px, 7.4vw, 54px); font-weight: 900; max-width: 860px; margin: 0 auto; }
  .nbs-hero h1 .nbs-underline { white-space: nowrap; color: var(--nbs-orange); text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 6px; }
  .nbs-hero-services { margin-top: 12px; font-family: var(--nbs-head); font-weight: 700; font-size: 14px; color: var(--nbs-orange); letter-spacing: .04em; text-transform: uppercase; }
  .nbs-hero-lead { margin-top: 10px; font-family: var(--nbs-head); font-weight: 800; font-size: 18px; }
  .nbs-hero-lead small { display: block; font-family: var(--nbs-body); font-weight: 500; font-size: 14px; color: var(--nbs-muted-dark); margin-top: 4px; }
  .nbs-hero-media { position: relative; max-width: 760px; margin: 18px auto 0; border-radius: 18px; overflow: hidden; border: 3px solid var(--nbs-orange); box-shadow: 0 20px 50px rgba(0, 0, 0, .45); }
  .nbs-hero-media img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; object-position: center 72%; }
  .nbs-hero-media-tag {
    position: absolute; top: 14px; right: 14px; background: var(--nbs-orange); color: var(--nbs-black);
    font-family: var(--nbs-head); font-weight: 900; font-size: 15px; line-height: 1.1; padding: 10px 12px; border-radius: 10px; transform: rotate(3deg);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
  }
  .nbs-hero-media-tag small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; }

  /* Ticker */
  .nbs-ticker { overflow: hidden; border-top: 1px solid var(--nbs-line-dark); border-bottom: 1px solid var(--nbs-line-dark); margin-top: 22px; background: #121212; }
  .nbs-ticker-track { display: flex; width: max-content; animation: nbs-marquee 26s linear infinite; }
  .nbs-ticker-item { display: flex; align-items: center; gap: 10px; padding: 13px 22px; font-family: var(--nbs-head); font-weight: 700; font-size: 14px; white-space: nowrap; color: #fff; }
  .nbs-ticker-item::after { content: "•"; color: var(--nbs-orange); margin-left: 22px; }
  .nbs-ticker-item b { color: var(--nbs-orange); }
  @keyframes nbs-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .nbs-ticker-track { animation: none; } }

  /* ---------- 03 Quiz (fake form) ---------- */
  .nbs-quiz { background: var(--nbs-charcoal); color: #fff; padding: 26px 0 44px; scroll-margin-top: 10px; }
  .nbs-quiz-card { max-width: 620px; margin: 0 auto; }
  .nbs-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .nbs-progress-bar { flex: 1; height: 8px; background: #2C2C2C; border-radius: 99px; overflow: hidden; }
  .nbs-progress-fill { height: 100%; width: 0; background: var(--nbs-orange); border-radius: 99px; transition: width .35s ease; }
  .nbs-progress-label { font-size: 12px; font-weight: 700; color: var(--nbs-muted-dark); min-width: 70px; text-align: right; }
  .nbs-step { display: none; animation: nbs-in .3s ease; }
  .nbs-step.is-active { display: block; }
  @keyframes nbs-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .nbs-q { text-align: center; font-family: var(--nbs-head); font-weight: 800; font-size: clamp(21px, 5vw, 26px); }
  .nbs-q-hint { text-align: center; font-size: 14px; color: var(--nbs-muted-dark); margin: 8px 0 20px; }
  .nbs-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .nbs-tiles-3 { grid-template-columns: repeat(3, 1fr); }
  .nbs-tile {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    min-height: 128px; padding: 18px 10px 14px; background: var(--nbs-tile); color: #fff; border: 2px solid transparent;
    border-radius: var(--nbs-radius); font-family: var(--nbs-head); font-weight: 700; font-size: 15px; line-height: 1.2; text-align: center; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .nbs-tile:hover { background: var(--nbs-tile-hover); }
  .nbs-tile:active { transform: scale(.97); }
  .nbs-tile:focus-visible { outline: 3px solid var(--nbs-orange-hover); outline-offset: 2px; }
  .nbs-tile svg { width: 46px; height: 46px; color: var(--nbs-orange); }
  .nbs-tile small { display: block; font-family: var(--nbs-body); font-weight: 500; font-size: 12px; color: var(--nbs-muted-dark); margin-top: 3px; }
  .nbs-tile.is-selected { border-color: var(--nbs-orange); background: #2B2418; }
  .nbs-tile-check {
    position: absolute; top: 9px; right: 9px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #555;
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: transparent;
  }
  .nbs-tile.is-selected .nbs-tile-check { background: var(--nbs-orange); border-color: var(--nbs-orange); color: var(--nbs-black); }
  .nbs-tile-wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; justify-content: flex-start; gap: 14px; padding: 16px 18px; text-align: left; }
  .nbs-tile-wide svg { width: 36px; height: 36px; flex: none; }
  .nbs-step-actions { display: flex; gap: 10px; margin-top: 20px; }
  .nbs-step-actions .nbs-btn { flex: 1; }
  .nbs-back { background: transparent; border: 0; color: var(--nbs-muted-dark); font-size: 14px; font-weight: 600; cursor: pointer; padding: 12px 6px; margin-top: 12px; display: inline-flex; gap: 6px; align-items: center; }
  .nbs-back:hover { color: #fff; }
  .nbs-center { text-align: center; }

  .nbs-field { margin-bottom: 14px; text-align: left; }
  .nbs-field label { display: block; font-size: 13px; font-weight: 600; color: var(--nbs-muted-dark); margin-bottom: 6px; }
  .nbs-input {
    width: 100%; font: 600 17px/1.2 var(--nbs-body); color: var(--nbs-ink); background: #fff; border: 2px solid #fff; border-radius: 10px;
    padding: 15px 16px; outline: none; transition: border-color .15s ease; -webkit-appearance: none;
  }
  .nbs-input:focus { border-color: var(--nbs-orange); }
  .nbs-input.is-invalid { border-color: #FF5A4E; }
  .nbs-err { display: none; color: #FF8A80; font-size: 13px; font-weight: 600; margin-top: 6px; }
  .nbs-field.has-error .nbs-err { display: block; }
  .nbs-postcode { text-transform: uppercase; text-align: center; font-size: 22px; letter-spacing: .08em; }
  .nbs-qualify { background: #1F2A1F; border: 1px solid #2F5D38; color: #CFF5D6; border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 600; text-align: center; margin-bottom: 18px; }
  .nbs-qualify b { color: #fff; }
  .nbs-privacy { font-size: 12px; color: #8E8E8E; text-align: center; margin-top: 20px; line-height: 1.5; }
  .nbs-privacy a { color: #BDBDBD; }
  .nbs-reassure { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; font-size: 13px; font-weight: 600; color: var(--nbs-muted-dark); }
  .nbs-reassure span::before { content: "✓ "; color: var(--nbs-orange); font-weight: 800; }
  .nbs-spinner { width: 20px; height: 20px; border: 3px solid rgba(0, 0, 0, .25); border-top-color: var(--nbs-black); border-radius: 50%; animation: nbs-spin .7s linear infinite; }
  @keyframes nbs-spin { to { transform: rotate(360deg); } }
  .nbs-done { text-align: center; padding: 10px 0; }
  .nbs-done-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--nbs-orange); color: var(--nbs-black); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 32px; font-weight: 900; }
  .nbs-done p { color: var(--nbs-muted-dark); margin-top: 10px; }

  /* ---------- 04 Proof strip ---------- */
  .nbs-proof { background: var(--nbs-white); padding: 26px 0; border-bottom: 1px solid #ECEAE5; }
  .nbs-proof-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
  .nbs-proof-num { font-family: var(--nbs-head); font-weight: 900; font-size: clamp(22px, 6vw, 32px); color: var(--nbs-ink); line-height: 1.05; }
  .nbs-proof-label { font-size: 12px; font-weight: 600; color: var(--nbs-muted); margin-top: 4px; line-height: 1.3; }
  .nbs-proof-grid > div + div { border-left: 1px solid #ECEAE5; }

  /* ---------- 05 Recent work ---------- */
  .nbs-work-grid { display: grid; grid-template-columns: 1fr; gap: 18px; margin-top: 30px; }
  .nbs-work-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, .08); }
  .nbs-work-img { position: relative; }
  .nbs-work-img img { width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; object-position: center 75%; }
  .nbs-work-tag { position: absolute; left: 12px; top: 12px; background: var(--nbs-orange); color: var(--nbs-black); font-family: var(--nbs-head); font-weight: 800; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 6px; }
  .nbs-work-body { padding: 18px 18px 20px; }
  .nbs-work-body h3 { font-size: 19px; font-weight: 800; }
  .nbs-work-body ul { list-style: none; margin: 10px 0 0; padding: 0; }
  .nbs-work-body li { position: relative; padding-left: 26px; margin-top: 7px; font-size: 15px; color: #3C3C3C; }
  .nbs-work-body li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--nbs-orange); color: var(--nbs-black); font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .nbs-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 26px; }
  .nbs-chip { background: #fff; border: 1px solid #E4E1DA; border-radius: 99px; padding: 8px 14px; font-size: 14px; font-weight: 600; }

  /* ---------- 06 Why us ---------- */
  .nbs-why-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 30px; }
  .nbs-why-item { display: flex; gap: 16px; align-items: flex-start; background: #fff; border: 1px solid #ECEAE5; border-radius: 14px; padding: 18px; }
  .nbs-why-icon { flex: none; width: 48px; height: 48px; border-radius: 12px; background: #FFF3E0; color: var(--nbs-orange-deep); display: flex; align-items: center; justify-content: center; }
  .nbs-why-icon svg { width: 26px; height: 26px; }
  .nbs-why-item h3 { font-size: 17px; font-weight: 800; }
  .nbs-why-item p { font-size: 15px; color: #4A4A4A; margin-top: 4px; }

  /* ---------- 06b Team ---------- */
  .nbs-team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 820px; margin: 28px auto 0; }
  .nbs-team-grid img { width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 14px; }
  .nbs-team-points { list-style: none; padding: 0; margin: 24px auto 0; max-width: 640px; }
  .nbs-team-points li { position: relative; padding-left: 30px; margin-top: 12px; font-size: 16px; color: #3C3C3C; }
  .nbs-team-points li::before { content: "✓"; position: absolute; left: 0; top: 1px; width: 20px; height: 20px; border-radius: 50%; background: var(--nbs-orange); color: var(--nbs-black); font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .nbs-team-points b { color: var(--nbs-ink); }

  /* ---------- 07 Reviews ---------- */
  .nbs-rating-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 560px; margin: 28px auto 0; }
  .nbs-rating-card { background: #fff; border: 1px solid #ECEAE5; border-radius: 14px; padding: 18px 12px; text-align: center; }
  .nbs-rating-card .nbs-google { font-size: 24px; }
  .nbs-rating-score { font-family: var(--nbs-head); font-weight: 900; font-size: 30px; margin-top: 6px; line-height: 1; }
  .nbs-rating-score small { font-size: 15px; color: var(--nbs-muted); font-weight: 700; }
  .nbs-rating-meta { font-size: 13px; color: var(--nbs-muted); font-weight: 600; margin-top: 6px; }
  .nbs-checkatrade { font-family: var(--nbs-head); font-weight: 800; font-size: 20px; color: #1B2E48; display: inline-flex; align-items: center; gap: 6px; }
  .nbs-checkatrade i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: #E03C31; color: #fff; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
  .nbs-review-list { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 22px; }
  .nbs-review { background: #fff; border: 1px solid #ECEAE5; border-radius: 14px; padding: 18px; }
  .nbs-review-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .nbs-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--nbs-orange); color: var(--nbs-black); font-family: var(--nbs-head); font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .nbs-review-name { font-weight: 700; font-size: 15px; }
  .nbs-review-src { font-size: 12px; color: var(--nbs-muted); }
  .nbs-review p { font-size: 15px; color: #333; }

  /* ---------- 08 Process ---------- */
  .nbs-steps { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 30px; counter-reset: nbs-step; }
  .nbs-step-card { position: relative; background: var(--nbs-tile); border-radius: 14px; padding: 20px 20px 20px 76px; }
  .nbs-step-card::before {
    counter-increment: nbs-step; content: counter(nbs-step); position: absolute; left: 18px; top: 18px; width: 42px; height: 42px; border-radius: 50%;
    background: var(--nbs-orange); color: var(--nbs-black); font-family: var(--nbs-head); font-weight: 900; font-size: 19px; display: flex; align-items: center; justify-content: center;
  }
  .nbs-step-card h3 { font-size: 17px; font-weight: 800; color: #fff; }
  .nbs-step-card p { font-size: 15px; color: var(--nbs-muted-dark); margin-top: 4px; }

  /* ---------- 09 FAQ ---------- */
  .nbs-faq { margin-top: 28px; }
  .nbs-faq details { background: #fff; border: 1px solid #ECEAE5; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .nbs-faq summary { list-style: none; cursor: pointer; padding: 17px 52px 17px 18px; position: relative; font-family: var(--nbs-head); font-weight: 700; font-size: 16px; }
  .nbs-faq summary::-webkit-details-marker { display: none; }
  .nbs-faq summary::after { content: "+"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; background: var(--nbs-orange); color: var(--nbs-black); font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .nbs-faq details[open] summary::after { content: "–"; }
  .nbs-faq details p { padding: 0 18px 18px; color: #444; font-size: 15px; }

  /* ---------- 10 Final CTA ---------- */
  .nbs-final { position: relative; overflow: hidden; text-align: center; }
  .nbs-final-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .22; }
  .nbs-final .nbs-wrap { position: relative; }
  .nbs-final h2 { font-size: clamp(28px, 6.4vw, 44px); font-weight: 900; }
  .nbs-final p { color: #DADADA; margin-top: 12px; font-size: 17px; }
  .nbs-offer-pill { display: inline-block; margin-top: 18px; background: rgba(248, 158, 27, .14); border: 1px solid rgba(248, 158, 27, .55); color: var(--nbs-orange); border-radius: 99px; padding: 8px 16px; font-family: var(--nbs-head); font-weight: 800; font-size: 14px; }

  /* ---------- 11 Footer + sticky CTA ---------- */
  .nbs-footer { background: var(--nbs-black); color: #9A9A9A; text-align: center; padding: 34px 0 110px; font-size: 13px; }
  .nbs-footer img { height: 84px; width: auto; margin: 0 auto 14px; }
  .nbs-footer a { color: #C9C9C9; }
  .nbs-footer p + p { margin-top: 6px; }
  .nbs-sticky {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(15, 15, 15, .94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--nbs-line-dark);
