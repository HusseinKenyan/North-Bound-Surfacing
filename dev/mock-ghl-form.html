<!--
  PREVIEW ONLY: do not paste into GHL.
  Stands in for the hidden native GHL form so the quiz → form autofill
  can be tested locally. Field names mimic a typical GHL form.
-->
<script>
  window.NBS_CONFIG_OVERRIDE = {
    successTimeoutMs: 1500,
    fields: {
      first_name: [], last_name: [],
      full_name: ['full_name'],
      services: ['surface_type'],
      size: ['driveway_size'],
      timeframe: ['project_timeframe'],
      summary: ['quiz_answers']
    }
  };
</script>
<div style="max-width:560px;margin:0 auto;padding:24px 16px;font:14px/1.4 system-ui,sans-serif">
  <form id="mock-ghl-form" class="builder-form">
    <h3 style="margin:0 0 10px">Mock GHL form (hidden)</h3>
    <input name="full_name" data-q="full_name" placeholder="Full Name" required>
    <input name="phone" data-q="phone" type="tel" placeholder="Phone" required>
    <input name="email" data-q="email" type="email" placeholder="Email" required>
    <input name="postal_code" data-q="postal_code" placeholder="Postcode">
    <fieldset><legend>Surface type</legend>
      <label><input type="checkbox" name="surface_type" value="Resin"> Resin</label>
      <label><input type="checkbox" name="surface_type" value="Tarmac"> Tarmac</label>
      <label><input type="checkbox" name="surface_type" value="Artificial Turf"> Artificial Turf</label>
      <label><input type="checkbox" name="surface_type" value="Paved Edging"> Paved Edging</label>
      <label><input type="checkbox" name="surface_type" value="Block Paving / Porcelain"> Block Paving / Porcelain</label>
    </fieldset>
    <fieldset><legend>Driveway size</legend>
      <label><input type="radio" name="driveway_size" value="Small (1-2 cars)"> Small</label>
      <label><input type="radio" name="driveway_size" value="Medium (3-4 cars)"> Medium</label>
      <label><input type="radio" name="driveway_size" value="Large (5+ cars)"> Large</label>
      <label><input type="radio" name="driveway_size" value="Not sure"> Not sure</label>
    </fieldset>
    <select name="project_timeframe"><option value="">Timeframe</option><option>As soon as possible</option><option>Within 1-3 months</option><option>3-6 months</option><option>Just getting prices</option></select>
    <textarea name="quiz_answers" placeholder="Quiz answers"></textarea>
    <label><input type="checkbox" name="terms_and_conditions" required> I agree to the terms &amp; privacy policy</label>
    <button type="submit">Submit</button>
  </form>
  <pre id="mock-ghl-result" style="display:none;background:#0f2a17;color:#b9f6c8;padding:14px;border-radius:10px;white-space:pre-wrap"></pre>
</div>
<script>
  document.getElementById('mock-ghl-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (!f.checkValidity()) { console.warn('[mock GHL] invalid', f); return; }
    var out = {};
    new FormData(f).forEach(function (v, k) { out[k] = out[k] ? [].concat(out[k], v) : v; });
    var pre = document.getElementById('mock-ghl-result');
    pre.textContent = 'Hidden GHL form received:\n' + JSON.stringify(out, null, 2);
    pre.style.display = 'block';
    window.__mockGhlSubmission = out;
    console.log('[mock GHL] submitted', out);
  });
</script>
