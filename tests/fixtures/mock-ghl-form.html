<!--
  TEST ONLY: never pasted into GHL.
  A stand-in that mirrors the real hidden GHL form (#form-v-k6neyDcf): plain text
  fields for each question, labels beside (not around) the inputs, random field names
  for the custom questions. Proves the quiz fills it by question wording.
-->
<script>
  window.NBS_CONFIG_OVERRIDE = { successTimeoutMs: 1500 };
</script>
<div id="form-v-k6neyDcf" style="max-width:560px;margin:0 auto;padding:24px 16px;font:14px/1.4 system-ui,sans-serif">
  <form id="mock-ghl-form" class="builder-form">
    <div class="form-field-wrapper"><div class="label-wrapper"><label>Where are you based? Note: We only cover greater manchester and surrounding areas.</label></div><input type="text" name="xK2a9QbLs1" placeholder="Enter your text"></div>
    <div class="form-field-wrapper"><div class="label-wrapper"><label>What are you looking to have installed (copy)</label></div><input type="text" name="Pq81mZr0Tn" placeholder="Enter your text"></div>
    <div class="form-field-wrapper"><div class="label-wrapper"><label>Roughly how big is your area?</label></div><input type="text" name="aB7cD3eF9g" placeholder="Enter your text"></div>
    <div class="form-field-wrapper"><div class="label-wrapper"><label>When would you like the work done?</label></div><input type="text" name="Hh4Jk2Lm8N" placeholder="Enter your text"></div>
    <div class="form-field-wrapper"><div class="label-wrapper"><label>What is your budget? Note: It is highly unlikely we will be able to price your driveway for less than £5,000.</label></div><input type="text" name="Zz5Yy6Xx7W" placeholder="Enter your text"></div>
    <div class="form-field-wrapper"><div class="label-wrapper"><label>Full name</label></div><input type="text" name="full_name" placeholder="Enter your full name"></div>
    <div class="form-field-wrapper"><div class="label-wrapper"><label>Phone *</label></div><input type="tel" name="phone" placeholder="+1 (555) 000-0000" required></div>
    <div class="form-field-wrapper"><div class="label-wrapper"><label>Email *</label></div><input type="email" name="email" placeholder="your@email.com" required></div>
    <div class="form-field-wrapper"><label><input type="checkbox" name="terms_and_conditions" required> I consent to receive SMS and emails from North Bound Surfacing</label></div>
    <button type="submit">Submit</button>
  </form>
  <pre id="mock-ghl-result" style="display:none;background:#0f2a17;color:#b9f6c8;padding:14px;border-radius:10px;white-space:pre-wrap"></pre>
</div>
<script>
  document.getElementById('mock-ghl-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (!f.checkValidity()) { console.warn('[mock GHL] invalid', f); return; }
    var out = {};
    new FormData(f).forEach(function (v, k) { out[k] = out[k] ? [].concat(out[k], v) : v; });
    var pre = document.getElementById('mock-ghl-result');
    pre.textContent = 'Hidden GHL form received:\n' + JSON.stringify(out, null, 2);
    pre.style.display = 'block';
    window.__mockGhlSubmission = out;
  });
</script>
